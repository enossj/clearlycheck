<script>
function computeFuelCost({ distance, roundTrip, efficiency, effUnit, price, people }) {
  const d = roundTrip ? distance * 2 : distance;
  const n = Math.max(1, people || 1);
  if (efficiency <= 0) return { fuelUsed: 0, totalCost: 0, perPerson: 0 };
  const fuelUsed = effUnit === 'l100km' ? d * (efficiency / 100) : d / efficiency;
  const totalCost = fuelUsed * price;
  return { fuelUsed, totalCost, perPerson: totalCost / n };
}

const KM_PER_MILE = 1.609344;
let distanceUnit = 'mi';
let effUnit = 'mpg';

function getDistanceInEffUnit(distance, distUnit, unit) {
  if (unit === 'mpg') {
    return distUnit === 'mi' ? distance : distance / KM_PER_MILE;
  }
  return distUnit === 'km' ? distance : distance * KM_PER_MILE;
}

function fmtCurrency(n) {
  return n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}

function fmtFuel(n) {
  if (!isFinite(n)) return '0';
  return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function setDistanceUnit(u) {
  distanceUnit = u;
  document.getElementById('btnDistMi').classList.toggle('active', u === 'mi');
  document.getElementById('btnDistKm').classList.toggle('active', u === 'km');
  document.getElementById('distanceUnitLabel').textContent = u;
  calculate();
}

function setEffUnit(u) {
  effUnit = u;
  document.getElementById('btnEffMpg').classList.toggle('active', u === 'mpg');
  document.getElementById('btnEffL100').classList.toggle('active', u === 'l100km');
  document.getElementById('efficiencyUnitLabel').textContent = u === 'l100km' ? 'L/100km' : 'MPG';
  document.getElementById('priceLabel').textContent = u === 'l100km' ? 'Fuel price (per liter)' : 'Fuel price (per gallon)';
  calculate();
}

function calculate() {
  const distance = parseFloat(document.getElementById('distance').value) || 0;
  const roundTrip = document.getElementById('roundTrip').checked;
  const efficiency = parseFloat(document.getElementById('efficiency').value) || 0;
  const price = parseFloat(document.getElementById('price').value) || 0;
  const people = Math.max(1, parseInt(document.getElementById('people').value, 10) || 1);

  if (efficiency <= 0) {
    document.getElementById('resultsBody').innerHTML = `
      <div class="verdict-hero">
        <div class="verdict-label">Total Fuel Cost</div>
        <div class="verdict-value">—</div>
        <div class="verdict-sub">Enter fuel economy above 0</div>
      </div>
    `;
    return;
  }

  const adjDistance = getDistanceInEffUnit(distance, distanceUnit, effUnit);
  const out = computeFuelCost({ distance: adjDistance, roundTrip, efficiency, effUnit, price, people });

  const fuelLabel = effUnit === 'l100km' ? 'L' : 'gal';
  const distLabel = distanceUnit === 'mi' ? 'miles' : 'km';
  const tripSub = roundTrip
    ? `For a round trip: ${fmtFuel(distance)} ${distLabel} each way, ${fmtFuel(distance * 2)} ${distLabel} total`
    : `For a one-way trip of ${fmtFuel(distance)} ${distLabel}`;

  let metricsHtml = `
    <div class="metric">
      <div class="metric-label">Fuel used</div>
      <div class="metric-value accent">${fmtFuel(out.fuelUsed)} ${fuelLabel}</div>
    </div>
  `;
  let gridCols = 'minmax(0, 1fr)';

  if (people > 1) {
    metricsHtml += `
      <div class="metric">
        <div class="metric-label">Per person (${people} people)</div>
        <div class="metric-value blue">${fmtCurrency(out.perPerson)}</div>
      </div>
    `;
    gridCols = 'minmax(0, 1fr) minmax(0, 1fr)';
  }

  document.getElementById('resultsBody').innerHTML = `
    <div class="verdict-hero">
      <div class="verdict-label">Total Fuel Cost</div>
      <div class="verdict-value">${fmtCurrency(out.totalCost)}</div>
      <div class="verdict-sub">${tripSub}</div>
    </div>
    <div class="metrics-grid" style="grid-template-columns: ${gridCols};">
      ${metricsHtml}
    </div>
  `;
}

calculate();

// FAQ accordion
document.querySelectorAll('.faq-q').forEach(btn => {
  btn.addEventListener('click', function() {
    const answer = btn.nextElementSibling;
    const isOpen = btn.classList.contains('open');
    document.querySelectorAll('.faq-q.open').forEach(b => {
      b.classList.remove('open');
      if (b.nextElementSibling) b.nextElementSibling.classList.remove('open');
    });
    if (!isOpen) { btn.classList.add('open'); if (answer) answer.classList.add('open'); }
  });
});
</script>
